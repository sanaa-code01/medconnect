# Lance MedConnect + MySQL en une commande :  docker compose up --build
# Puis ouvrir http://localhost:8080
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: medconnect_db
      MYSQL_USER: medconnect
      MYSQL_PASSWORD: ${DB_PASSWORD:-medconnect}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/medconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: medconnect
      DB_PASSWORD: ${DB_PASSWORD:-medconnect}
      # Crée des comptes et des demandes de démonstration au premier démarrage
      DEMO_DATA: "true"
    ports:
      - "8080:8080"

volumes:
  db-data:
