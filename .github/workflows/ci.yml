name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Compilation et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build + tests unitaires
        run: mvn -B clean verify
      - name: Archive du WAR
        uses: actions/upload-artifact@v4
        with:
          name: medconnect-war
          path: target/medconnect.war

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build de l'image
        run: docker build -t medconnect:ci .
